<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Player Datapad - SW5.5e</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@500;600;700&display=swap');

        :root {
            --bg-base: #020617; /* Slate 950 */
            --bg-panel: rgba(15, 23, 42, 0.7);
            --neon-cyan: #0ea5e9;
            --neon-cyan-glow: rgba(14, 165, 233, 0.5);
            --neon-amber: #f59e0b;
        }

        body {
            background-color: var(--bg-base);
            color: #e2e8f0;
            font-family: 'Rajdhani', sans-serif;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* Scanline Overlay effect for the Datapad feel */
        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
            opacity: 0.3;
        }

        .datapad-font { font-family: 'Share Tech Mono', monospace; }

        /* Mobile Layout Structure */
        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh; /* Mobile browser height fix */
            position: relative;
            z-index: 10;
        }

        .header {
            border-bottom: 2px solid var(--neon-cyan);
            box-shadow: 0 0 10px var(--neon-cyan-glow);
            background: linear-gradient(180deg, rgba(2,6,23,1) 0%, rgba(15,23,42,1) 100%);
        }

        .scroll-area {
            flex: 1;
            overflow-y: auto;
            padding-bottom: 80px; /* Space for nav */
            scrollbar-width: none; /* Firefox */
        }
        .scroll-area::-webkit-scrollbar { display: none; } /* Chrome/Safari */

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(2, 6, 23, 0.95);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(14, 165, 233, 0.3);
            display: flex;
            justify-content: space-around;
            padding-bottom: env(safe-area-inset-bottom);
            z-index: 50;
        }

        .nav-btn {
            flex: 1;
            padding: 12px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #64748b;
            transition: all 0.2s;
        }
        .nav-btn.active {
            color: var(--neon-cyan);
            text-shadow: 0 0 8px var(--neon-cyan-glow);
        }
        .nav-btn svg { width: 24px; height: 24px; margin-bottom: 4px; }

        /* Card Styles */
        .data-card {
            background: var(--bg-panel);
            border: 1px solid rgba(14, 165, 233, 0.2);
            border-left: 3px solid var(--neon-cyan);
            border-radius: 4px;
            margin-bottom: 12px;
            position: relative;
            overflow: hidden;
        }
        
        .data-card::after {
            content: "";
            position: absolute;
            top: 0; right: 0;
            width: 30px; height: 30px;
            background: linear-gradient(225deg, rgba(14,165,233,0.1) 50%, transparent 50%);
        }

        .level-badge {
            background: rgba(14, 165, 233, 0.1);
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
        }

        .class-tag {
            font-size: 0.65rem;
            padding: 2px 6px;
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid rgba(245, 158, 11, 0.4);
            color: var(--neon-amber);
            border-radius: 12px;
            white-space: nowrap;
        }

        /* Animations */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .tab-content { animation: fadeIn 0.3s ease-out; }
        
        .blink { animation: blinker 2s linear infinite; }
        @keyframes blinker { 50% { opacity: 0.3; } }
    </style>
</head>

            </div>
        </div>

            </div>
            <div id="armory-container">

        </div>

        <!-- TAB: HOLOCRON (Spells) -->
        <div id="tab-holocron" class="tab-content hidden">
            <div class="mb-4 sticky top-0 z-20 bg-[#020617] pt-2 pb-4 border-b border-slate-800">
                <h2 class="text-2xl font-bold text-white tracking-wide uppercase mb-3">Jedi Holocron</h2>
                
                <div class="flex gap-2 mb-3 overflow-x-auto pb-1 scroll-area">
                    <button onclick="filterSpells('All')" class="filter-btn bg-cyan-900/30 border border-cyan-800 text-cyan-300 px-3 py-1 rounded text-xs uppercase font-bold whitespace-nowrap active-filter">All</button>
                    <button onclick="filterSpells('Cantrip')" class="filter-btn bg-slate-800 border border-slate-700 text-slate-400 px-3 py-1 rounded text-xs uppercase font-bold whitespace-nowrap">Cantrip</button>
                    <button onclick="filterSpells('1st')" class="filter-btn bg-slate-800 border border-slate-700 text-slate-400 px-3 py-1 rounded text-xs uppercase font-bold whitespace-nowrap">Level 1</button>
                    <button onclick="filterSpells('2nd')" class="filter-btn bg-slate-800 border border-slate-700 text-slate-400 px-3 py-1 rounded text-xs uppercase font-bold whitespace-nowrap">Level 2</button>
                    <button onclick="filterSpells('3rd')" class="filter-btn bg-slate-800 border border-slate-700 text-slate-400 px-3 py-1 rounded text-xs uppercase font-bold whitespace-nowrap">Level 3</button>
                </div>

                <div class="relative">
                    <svg class="w-5 h-5 absolute left-3 top-2.5 text-cyan-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    <input type="text" id="search-holocron" onkeyup="filterList('holocron')" class="w-full bg-slate-900 border border-cyan-900/50 rounded-md pl-10 pr-4 py-2 text-white placeholder-slate-500 focus:outline-none focus:border-cyan-500 text-sm datapad-font" placeholder="Search force powers or 5e spells...">
                </div>
            </div>
            
            <div id="holocron-container">
                <!-- Injected via JS -->
            </div>
        </div>

    </main>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <button onclick="switchTab('profiles')" id="nav-profiles" class="nav-btn active">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
            <span class="text-[10px] uppercase font-bold tracking-widest">Profiles</span>
        </button>
        <button onclick="switchTab('armory')" id="nav-armory" class="nav-btn">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg>
            <span class="text-[10px] uppercase font-bold tracking-widest">Armory</span>
        </button>
        <button onclick="switchTab('holocron')" id="nav-holocron" class="nav-btn">

</div>

    // --- RENDER FUNCTIONS ---
    function renderClasses() {
        const container = document.getElementById('classes-container');
        let html = '';
        classData.forEach(c => {
            html += `
                <div class="data-card p-4">
                    <div class="flex justify-between items-start mb-2">
                        <h3 class="text-lg font-bold text-cyan-400">${c.sw}</h3>
                        <span class="datapad-font text-xs text-slate-500 uppercase tracking-widest border border-slate-700 px-2 py-0.5 bg-slate-900 rounded">5.5e: ${c.dnd}</span>
                    </div>
                    <p class="text-sm text-slate-300 mb-3">${c.desc}</p>
                    <div class="bg-slate-900/50 p-2 rounded border border-slate-800">
                        <span class="text-[10px] uppercase text-cyan-600 font-bold block mb-1">Key Translations</span>
                        <p class="text-xs text-slate-400 font-mono">${c.features}</p>
                    </div>
                </div>
            `;
        });
        container.innerHTML = html;
    }

    function renderArmory() {
        const container = document.getElementById('armory-container');
        // Group by category
        const categories = [...new Set(armoryData.map(item => item.cat))];
        let html = '';
        
        categories.forEach(cat => {
            html += `<h3 class="text-cyan-500 font-bold uppercase tracking-widest text-sm mb-3 mt-6 pl-1 border-l-2 border-cyan-500">${cat}</h3>`;
            const items = armoryData.filter(i => i.cat === cat);
            items.forEach(item => {
                html += `
                    <div class="data-card p-3 armory-item" data-search="${item.dnd.toLowerCase()} ${item.sw.toLowerCase()}">
                        <div class="flex justify-between items-end mb-1">
                            <span class="font-bold text-white text-base">${item.sw}</span>
                            <span class="datapad-font text-[10px] text-cyan-600">${item.dnd}</span>
                        </div>
                        <div class="text-xs font-bold text-amber-500 mb-2 font-mono">${item.dmg}</div>
                        <p class="text-sm text-slate-400 leading-snug">${item.desc}</p>
                    </div>
                `;
            });
        });
        container.innerHTML = html;
    }

    let currentSpellFilter = 'All';

    function renderHolocron() {
        const container = document.getElementById('holocron-container');
        let html = '';
        
        const filteredData = currentSpellFilter === 'All' 
            ? spellData 
            : spellData.filter(s => s.lvl === currentSpellFilter);

        filteredData.forEach(spell => {
            // Render class tags
            let classTagsHtml = spell.classes.map(c => `<span class="class-tag">${c}</span>`).join(' ');

            html += `
                <div class="data-card p-3 holocron-item" data-search="${spell.dnd.toLowerCase()} ${spell.sw.toLowerCase()}">
                    <div class="flex justify-between items-start mb-1">
                        <div>
                            <span class="font-bold text-white text-base block">${spell.sw}</span>
                            <span class="datapad-font text-[10px] text-cyan-600 block">5.5e: ${spell.dnd}</span>
                        </div>
                        <div class="level-badge text-xs font-bold px-2 py-1 rounded datapad-font shrink-0">
                            ${spell.lvl}
                        </div>
                    </div>
                    <div class="flex flex-wrap gap-1 mb-2 mt-1">
                        ${classTagsHtml}
                    </div>
                    <p class="text-sm text-slate-400 leading-snug border-t border-slate-800 pt-2">${spell.desc}</p>
                </div>
            `;
        });
        container.innerHTML = html;
    }

    // --- INTERACTION LOGIC ---
    function switchTab(tabId) {
        // Hide all tabs
        document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
        // Remove active class from all nav buttons
        document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
        
        // Show selected tab
        document.getElementById(`tab-${tabId}`).classList.remove('hidden');
        // Add active class to selected nav button
        document.getElementById(`nav-${tabId}`).classList.add('active');
        
        // Scroll to top of main content area smoothly
        document.getElementById('main-content').scrollTo({ top: 0, behavior: 'smooth' });
    }

    function filterSpells(level) {
        currentSpellFilter = level;
        // Update filter button UI
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.classList.remove('bg-cyan-900/30', 'border-cyan-800', 'text-cyan-300');
            btn.classList.add('bg-slate-800', 'border-slate-700', 'text-slate-400');
        });
        event.target.classList.remove('bg-slate-800', 'border-slate-700', 'text-slate-400');
        event.target.classList.add('bg-cyan-900/30', 'border-cyan-800', 'text-cyan-300');
        
        // Clear search when changing level filters
        document.getElementById('search-holocron').value = '';
        renderHolocron();
    }

    function filterList(type) {
        const input = document.getElementById(`search-${type}`).value.toLowerCase();
        const items = document.querySelectorAll(`.${type}-item`);
        
        items.forEach(item => {
            const searchData = item.getAttribute('data-search');
            if (searchData.includes(input)) {
                item.style.display = 'block';
            } else {
                item.style.display = 'none';
            }
        });

        // Hide category headers in armory if searching
        if (type === 'armory') {
            const headers = document.querySelectorAll('#armory-container h3');
            headers.forEach(h => {
                h.style.display = input === '' ? 'block' : 'none';
            });
        }
    }

    // Initialize App
    renderClasses();
    renderArmory();
    renderHolocron();
</script>

</body>
</html>
